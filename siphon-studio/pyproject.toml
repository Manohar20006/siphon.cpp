[project]
name = "siphon-studio"
version = "0.1.0"
description = "Local launcher, desktop dashboard, TUI and headless CLI for siphon.cpp — the MoE expert-streaming llama.cpp fork"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.86,<4"]

[project.scripts]
siphon = "siphon.cli.main:entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["siphon", "siphon.core", "siphon.cli", "siphon.tui", "siphon.desktop"]
