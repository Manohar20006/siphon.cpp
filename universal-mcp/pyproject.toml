[project]
name = "universal-worker-bridge-mcp"
version = "0.1.0"
description = "A stdio MCP bridge from Codex/Astra to Antigravity and hosted coding workers"
requires-python = ">=3.10"

[project.scripts]
universal-worker-mcp = "universal_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
